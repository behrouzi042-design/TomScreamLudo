name: Build Tom Scream Ludo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source project
        run: unzip -o TomScreamLudo-Android-Project.zip

      - name: Build debug APK
        working-directory: TomScreamLudo
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomScreamLudo-debug-apk
          path: TomScreamLudo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
